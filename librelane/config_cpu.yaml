meta:
  version: 3
  flow: Classic

DESIGN_NAME: az_v_core_top
VERILOG_FILES:
- dir::../../AZ_V/rtl/pkg/riscv_pkg.sv
- dir::../../AZ_V/rtl/frontend/btb.sv
- dir::../../AZ_V/rtl/frontend/bht.sv
- dir::../../AZ_V/rtl/frontend/ras.sv
- dir::../../AZ_V/rtl/frontend/instr_queue.sv
- dir::../../AZ_V/rtl/frontend/fetch_unit.sv
- dir::../../AZ_V/rtl/core/regfile.sv
- dir::../../AZ_V/rtl/core/decode_stage.sv
- dir::../../AZ_V/rtl/core/alu.sv
- dir::../../AZ_V/rtl/core/execute_stage.sv
- dir::../../AZ_V/rtl/core/memory_stage.sv
- dir::../../AZ_V/rtl/core/writeback_stage.sv
- dir::../../AZ_V/rtl/pipeline/hazard_unit.sv
- dir::../../AZ_V/rtl/top/az_v_core_top.sv

USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

PNR_SDC_FILE: dir::az_v_core_top.sdc
SIGNOFF_SDC_FILE: dir::az_v_core_top.sdc
FALLBACK_SDC: dir::az_v_core_top.sdc

IO_PIN_ORDER_CFG: dir::pin_order_cpu.cfg

CLOCK_PORT: clk
CLOCK_PERIOD: 40

VDD_NETS:
- VDD
GND_NETS:
- VSS

# Restrict Macro internal routing to Metal4 to preserve Metal5 for Top-Level Chip integration
RT_MIN_LAYER: Metal2
RT_MAX_LAYER: Metal4

# Synthesis Strategy for Timing Optimization
SYNTH_STRATEGY: "DELAY 4"
DEFAULT_CORNER: "max_ss_125C_4v50"
SYNTH_BUFFERING: true
SYNTH_SIZING: true
SYNTH_ABC_BUFFERING: true
SYNTH_MAX_FANOUT: 16

# Floorplanning & Placement
FP_SIZING: relative
FP_CORE_UTIL: 30
FP_ASPECT_RATIO: 1.0
PL_TARGET_DENSITY_PCT: 30
PL_TIMING_DRIVEN: true

# Timing and Slack Margins
PL_RESIZER_SETUP_SLACK_MARGIN: 0.30
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 60
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 60

RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.25
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.30
GRT_ALLOW_CONGESTION: true

# Design Repair for Slew and Capacitance Violations
RUN_POST_GRT_DESIGN_REPAIR: true
DESIGN_REPAIR_MAX_SLEW_PCT: 25
DESIGN_REPAIR_MAX_CAP_PCT: 25
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 25
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 25

# Exclude weak delay cells from being used for general buffering/repair
EXTRA_EXCLUDED_CELLS:
  - "gf180mcu_fd_sc_mcu7t5v0__dly*"

# Antenna repair
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

ERROR_ON_MAGIC_DRC: true
MAGIC_EXT_UNIQUE: notopports
