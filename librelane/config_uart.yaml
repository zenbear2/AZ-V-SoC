meta:
  version: 3
  flow: Classic

DESIGN_NAME: az_v_uart_top
VERILOG_FILES:
- dir::../../AZ_V_UART/rtl/pkg/uart_pkg.sv
- dir::../../AZ_V_UART/rtl/core/baud_rate_gen.sv
- dir::../../AZ_V_UART/rtl/core/sync_fifo.sv
- dir::../../AZ_V_UART/rtl/core/uart_rx.sv
- dir::../../AZ_V_UART/rtl/core/uart_tx.sv
- dir::../../AZ_V_UART/rtl/axi/axi_lite_slave.sv
- dir::../../AZ_V_UART/rtl/top/az_v_uart_top.sv

USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

PNR_SDC_FILE: dir::az_v_uart_top.sdc
SIGNOFF_SDC_FILE: dir::az_v_uart_top.sdc
FALLBACK_SDC: dir::az_v_uart_top.sdc

IO_PIN_ORDER_CFG: dir::pin_order_uart.cfg

CLOCK_PORT: clk
CLOCK_PERIOD: 40

VDD_NETS:
- VDD
GND_NETS:
- VSS

# Restrict Macro internal routing to Metal4 to preserve Metal5 for Top-Level Chip integration
RT_MIN_LAYER: Metal2
RT_MAX_LAYER: Metal4

# Synthesis Strategy for Timing Optimization
SYNTH_STRATEGY: "DELAY 4"
SYNTH_BUFFERING: true
SYNTH_SIZING: true
SYNTH_ABC_BUFFERING: true

# Floorplanning & Placement
FP_SIZING: relative
FP_CORE_UTIL: 30
FP_ASPECT_RATIO: 1.0
PL_TARGET_DENSITY_PCT: 30
PL_TIMING_DRIVEN: true

# Timing and Slack Margins
PL_RESIZER_SETUP_SLACK_MARGIN: 0.1
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 60
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 60

RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.05
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3
GRT_ALLOW_CONGESTION: true

# Design Repair for Slew and Capacitance Violations
RUN_POST_GRT_DESIGN_REPAIR: true
DESIGN_REPAIR_MAX_SLEW_PCT: 10
DESIGN_REPAIR_MAX_CAP_PCT: 10

# Antenna repair
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

ERROR_ON_MAGIC_DRC: true
MAGIC_EXT_UNIQUE: notopports
