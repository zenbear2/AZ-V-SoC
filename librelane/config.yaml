meta:
  version: 3
  flow: Chip
  substituting_steps:

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../../AZ_V/rtl/pkg/riscv_pkg.sv
- dir::../../AZ_V_UART/rtl/pkg/uart_pkg.sv
- dir::../rtl/jtag/jtag_tap.sv
- dir::../rtl/jtag/jtag_dtm.sv
- dir::../rtl/jtag/jtag_dm.sv
- dir::../rtl/bus/az_v_soc_interconnect.sv
- dir::../rtl/az_v_soc_top.sv
- dir::../rtl/asic/sram_bank_array.sv
- dir::../rtl/asic/chip_core.sv
- dir::../rtl/asic/chip_top.sv

USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

VERILOG_DEFINES: ["ASIC_SYNTHESIS", "SLOT_1X1"]

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

VDD_NETS:
- VDD
GND_NETS:
- VSS

IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo
- gf180mcu_fd_ip_sram__sram512x8m8wm1
- az_v_core_top
- az_v_uart_top

CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 40

PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

ERROR_ON_MAGIC_DRC: False

MACROS:
  az_v_core_top:
    gds:
      - dir::../final_cpu/gds/az_v_core_top.gds
