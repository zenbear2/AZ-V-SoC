    lib:
      "*_tt_025C_5v00":
        - dir::../final_cpu/lib/nom_tt_025C_5v00/az_v_core_top__nom_tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - dir::../final_cpu/lib/nom_ff_n40C_5v50/az_v_core_top__nom_ff_n40C_5v50.lib
      "*_ss_125C_4v50":
